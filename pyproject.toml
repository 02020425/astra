[project]
name = "astra"
version = "1.0.0"
description = "Multi-Agent RAG-Enhanced A-Share Daily Report System"
requires-python = ">=3.12,<3.14"
dependencies = [
    "akshare>=1.18.60",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pyspark>=3.5,<4",
    "openai>=1.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "gradio>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]
